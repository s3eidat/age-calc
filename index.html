<body data-tool="age-calc">
<main class="s3-main">
  <section class="s3-hero">
    <h1>Age Calc</h1>
    <p>Your exact age in years, months and days, the countdown to your next birthday, your Hijri date of birth, and how you compare with someone else.</p>
  </section>

  <div class="ag-grid">
    <section class="card stack">
      <h2>Dates</h2>
      <label class="field">Date of birth
        <input class="input" id="dob" type="date" min="0001-01-01" max="9999-12-31">
      </label>
      <div class="field">
        <label for="on">Age on</label>
        <div class="row nowrap">
          <input class="input grow" id="on" type="date" min="0001-01-01" max="9999-12-31">
          <button type="button" class="btn" id="today">Today</button>
        </div>
      </div>
      <hr class="sep">
      <h2>Compare with someone <span class="faint">(optional)</span></h2>
      <label class="field">Name
        <input class="input" id="name2" autocomplete="off" maxlength="40" placeholder="e.g. Sara" dir="auto">
      </label>
      <label class="field">Their date of birth
        <input class="input" id="dob2" type="date" min="0001-01-01" max="9999-12-31">
      </label>
      <p class="faint" id="err" role="alert"></p>
    </section>

    <section class="card stack">
      <div class="row between">
        <h2>Your age</h2>
        <button class="btn small" id="copy"><svg class="i"><use href="#i-copy"/></svg>Copy</button>
      </div>
      <div class="age-hero" id="hero"><div class="empty"><b>Enter your date of birth</b>Everything is worked out on this device.</div></div>
      <div class="stats" id="totals"></div>
      <div class="grid-2 tight" id="facts"></div>
      <div id="cmp"></div>
    </section>
  </div>
</main>
<script src="app.js"></script>
